name: Verify frontend/dist

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'
      - '!frontend/__init__.py'
      - '.github/workflows/build_frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          # Vite 8 requires ^20.19.0 or >=22.12.0; on Node 18 `npm run build`
          # fails, which silently stops dist from being rebuilt.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Verify committed dist
        run: |
          if [[ -n "$(git status --porcelain frontend/dist)" ]]; then
            echo "::error::frontend/dist is stale. Run 'cd frontend && npm run build' and commit the generated files."
            git status --short frontend/dist
            git diff -- frontend/dist
            exit 1
          fi
          echo "frontend/dist is up to date"
